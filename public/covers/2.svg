    <radialGradient id="halo"><stop stop-color="#96b4c9" stop-opacity=".4"/><stop offset="1" stop-color="#678cab" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".3" cy=".25" r=".85"><stop stop-color="#e4edf0"/><stop offset=".3" stop-color="#c7d9dc"/><stop offset=".65" stop-color="#8daebc"/><stop offset=".87" stop-color="#4d738e"/><stop offset="1" stop-color="#344e67"/></radialGradient>
