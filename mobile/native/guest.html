<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>澄音 · 播放空间</title><style>
@studio_theme@
:root { color-scheme:dark; font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif; color:var(--studio-ink); background:var(--studio-bg) }
* { box-sizing:border-box }
body { max-width:44rem; margin:auto; padding:clamp(20px,5vw,48px) 18px; min-height:100vh; background:var(--studio-wash) fixed }
section { margin:16px 0; padding:20px; background:var(--studio-panel); border:1px solid var(--studio-line); border-radius:var(--studio-radius) }
h1,h2,p { margin:0 0 10px } h1 { font-size:28px } h2 { font-size:18px }
label { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0 }
button,input,select { font:inherit; color:inherit; border:1px solid var(--studio-line); border-radius:8px; padding:7px 10px; background:var(--studio-surface) }
button { cursor:pointer; margin:2px } button:hover { border-color:var(--studio-keyline) }
#request,#toggle { color:var(--studio-accent); background:var(--studio-selected) }
input[type=range] { min-width:0; accent-color:var(--studio-accent) } select { max-width:65% } #note { color:var(--studio-muted) } input[type=number] { width:6em }
</style>
<h1 id="room">播放空间</h1><p id="note" role="status"></p>
<section id="pair"><button id="request">申请加入</button><form id="code"><label>主机配对码 <input required pattern="[0-9]{6}" maxlength="6" inputmode="numeric"></label><button>用配对码加入</button></form></section>
<main hidden><section><h2>空间播放</h2><label>曲目 <select id="songs"></select></label><button id="previous">上一首</button><button id="toggle">播放</button><button id="next">下一首</button> <button id="sound">启用此设备声音</button><label>进度 <input id="seek" type="range" min="0" step="0.1"></label></section>
<section><h2>输出设备</h2><div id="outputs"></div></section><div id="requests"></div><button id="leave">离开空间</button></main>
<script src="/outputs.js"></script><script src="/guest.js"></script></html>
